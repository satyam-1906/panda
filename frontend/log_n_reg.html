<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lazy Panda — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --charcoal: #1A1A1A;
      --cream: #E8E8E6;
      --sage: #588157;
      --ochre: #BCB8B1;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", sans-serif;
      background: linear-gradient(-45deg, var(--cream), #DFDFDC, #F0F0EE, var(--cream));
      background-size: 400% 400%;
      animation: bg-shift 15s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated fluid mesh gradient blobs */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.8;
      mix-blend-mode: multiply;
      animation: fluid-mesh 14s ease-in-out infinite alternate;
    }
    body::before {
      width: 380px;
      height: 380px;
      top: -80px;
      left: -80px;
      background: radial-gradient(circle, rgba(88, 129, 87, 0.65) 0%, rgba(232, 232, 230, 0) 70%);
    }
    body::after {
      width: 350px;
      height: 350px;
      bottom: -60px;
      right: -60px;
      background: radial-gradient(circle, rgba(188, 184, 177, 0.65) 0%, rgba(232, 232, 230, 0) 70%);
      animation-delay: -7s;
    }
    @keyframes fluid-mesh {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }
      50% {
        transform: translate(35px, -20px) rotate(180deg) scale(1.25);
        border-radius: 60% 40% 50% 50% / 50% 60% 40% 60%;
      }
      100% {
        transform: translate(-20px, 25px) rotate(360deg) scale(0.95);
        border-radius: 50% 50% 60% 40% / 40% 40% 60% 50%;
      }
    }

    @keyframes bg-shift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* Refractive Liquid Glass Card */
    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      border-radius: 22px;
      padding: 32px 28px 28px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(30px) saturate(120%);
      -webkit-backdrop-filter: blur(30px) saturate(120%);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.95),
        inset 0 -1px 2px rgba(26, 26, 26, 0.06),
        0 2px 4px rgba(26, 26, 26, 0.03),
        0 24px 64px rgba(26, 26, 26, 0.1);
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 1;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 24px; right: 24px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      border-radius: 50%;
    }

    /* Brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        0 4px 12px rgba(88, 129, 87, 0.12);
      display: grid;
      place-items: center;
      transition: transform 400ms cubic-bezier(0.25, 1, 0.5, 1);
    }
    .logo-wrap:hover {
      transform: translateY(-2px) scale(1.05);
    }
    .logo-wrap img { width: 28px; height: 28px; object-fit: contain; }

    .brand-text h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--charcoal);
      letter-spacing: 0.01em;
    }
    .brand-text p {
      font-size: 0.72rem;
      color: rgba(26, 26, 26, 0.6);
      margin-top: 1px;
    }

    /* Tab switcher */
    .tabs {
      display: flex;
      background: rgba(26, 26, 26, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      backdrop-filter: blur(10px);
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(26, 26, 26, 0.6);
      cursor: pointer;
      border-radius: 8px;
      transition: all 400ms cubic-bezier(0.25, 1, 0.5, 1);
      user-select: none;
      letter-spacing: 0.02em;
    }
    .tab:hover { color: var(--charcoal); }
    .tab.active {
      color: var(--charcoal);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.85),
        0 2px 8px rgba(26, 26, 26, 0.06);
    }
    #tab-login.active  {
      background: rgba(88, 129, 87, 0.28);
      border: 1px solid rgba(88, 129, 87, 0.2);
    }
    #tab-register.active {
      background: rgba(188, 184, 177, 0.3);
      border: 1px solid rgba(188, 184, 177, 0.2);
    }

    /* Form panels */
    .form-panel { display: flex; flex-direction: column; gap: 14px; }
    .form-panel.hidden { display: none !important; }

    /* Field */
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .field label {
      font-size: 0.73rem;
      font-weight: 700;
      color: rgba(26, 26, 26, 0.7);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.35);
      color: var(--charcoal);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: all 400ms cubic-bezier(0.25, 1, 0.5, 1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8);
    }
    .field input::placeholder { color: rgba(26, 26, 26, 0.35); }
    .field input:focus {
      border-color: rgba(88, 129, 87, 0.7);
      background: rgba(255, 255, 255, 0.45);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        0 0 0 3px rgba(88, 129, 87, 0.25);
    }
    #panel-register .field input:focus {
      border-color: rgba(188, 184, 177, 0.7);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        0 0 0 3px rgba(188, 184, 177, 0.2);
    }

    /* Submit button */
    .submit-btn {
      position: relative;
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--charcoal);
      letter-spacing: 0.04em;
      cursor: pointer;
      overflow: hidden;
      transition: 
        transform 450ms cubic-bezier(0.25, 1, 0.5, 1), 
        box-shadow 450ms cubic-bezier(0.25, 1, 0.5, 1), 
        background-color 450ms cubic-bezier(0.25, 1, 0.5, 1), 
        border-color 450ms cubic-bezier(0.25, 1, 0.5, 1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .submit-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 60%);
      border-radius: inherit;
      pointer-events: none;
      transition: transform 600ms cubic-bezier(0.25, 1, 0.5, 1);
    }
    .submit-btn:hover::before {
      transform: scale(1.08) translate(5px, 5px);
    }
    .submit-btn:hover { transform: translateY(-2.5px); }
    .submit-btn:active { transform: translateY(0) scale(0.97); transition: transform 100ms ease; }
    .submit-btn:disabled { opacity: 0.55; cursor: default; transform: none; }

    #btn-do-login {
      background: rgba(88, 129, 87, 0.2);
      border: 1px solid rgba(88, 129, 87, 0.5);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.95),
        0 6px 18px rgba(88, 129, 87, 0.2);
    }
    #btn-do-login:hover {
      background: rgba(88, 129, 87, 0.32);
      border-color: rgba(88, 129, 87, 0.75);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.95),
        0 10px 24px rgba(88, 129, 87, 0.35);
    }

    #btn-do-register {
      background: rgba(188, 184, 177, 0.22);
      border: 1px solid rgba(188, 184, 177, 0.5);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.95),
        0 6px 18px rgba(188, 184, 177, 0.18);
    }
    #btn-do-register:hover {
      background: rgba(188, 184, 177, 0.35);
      border-color: rgba(188, 184, 177, 0.7);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.95),
        0 10px 24px rgba(188, 184, 177, 0.25);
    }

    /* Inline loader on button */
    .btn-loader {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(33, 34, 36, 0.2);
      border-radius: 50%;
      border-top-color: var(--charcoal);
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Feedback message */
    .msg {
      font-size: 0.76rem;
      font-weight: 600;
      text-align: center;
      padding: 8px 10px;
      border-radius: 8px;
      letter-spacing: 0.01em;
      display: none;
      transition: all 400ms cubic-bezier(0.25, 1, 0.5, 1);
    }
    .msg.show { display: block; }
    .msg.success {
      color: #2b7050;
      background: rgba(121, 152, 114, 0.2);
      border: 1px solid rgba(121, 152, 114, 0.4);
    }
    .msg.error {
      color: #9c452e;
      background: rgba(226, 149, 76, 0.2);
      border: 1px solid rgba(226, 149, 76, 0.4);
    }

    /* Divider with text */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(33, 34, 36, 0.1), transparent);
    }

    /* Switch mode hint */
    .switch-hint {
      text-align: center;
      font-size: 0.74rem;
      color: rgba(33, 34, 36, 0.6);
    }
    .switch-hint span {
      color: var(--ochre);
      cursor: pointer;
      font-weight: 700;
      transition: color 400ms cubic-bezier(0.25, 1, 0.5, 1);
    }
    .switch-hint span:hover { color: #b07c4c; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Brand -->
    <div class="brand">
      <div class="logo-wrap" aria-label="Lazy Panda logo">
        <img src="assets/panda.png" alt="Lazy Panda" />
      </div>
      <div class="brand-text">
        <h1>Lazy Panda</h1>
        <p>your AI video companion</p>
      </div>
    </div>

    <!-- Tab switcher -->
    <div class="tabs" role="tablist">
      <div class="tab active" id="tab-login"    role="tab" aria-controls="panel-login"    aria-selected="true">Login</div>
      <div class="tab"        id="tab-register" role="tab" aria-controls="panel-register" aria-selected="false">Register</div>
    </div>

    <!-- LOGIN panel -->
    <div id="panel-login" class="form-panel" role="tabpanel" aria-labelledby="tab-login">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div id="login-msg" class="msg"></div>
      <button class="submit-btn" id="btn-do-login">
        <span class="btn-text">Sign In</span>
      </button>
    </div>

    <div class="divider"></div>

    <!-- REGISTER panel -->
    <div id="panel-register" class="form-panel hidden" role="tabpanel" aria-labelledby="tab-register">
      <div class="field">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="Jane Doe" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="reg-username">Username</label>
        <input type="text" id="reg-username" placeholder="lazypanda42" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="reg-mobile">Mobile No.</label>
        <input type="tel" id="reg-mobile" placeholder="+91 00000 00000" autocomplete="tel" required />
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password" required />
      </div>
      <div id="register-msg" class="msg"></div>
      <button class="submit-btn" id="btn-do-register">
        <span class="btn-text">Create Account</span>
      </button>
    </div>

    <!-- Switch hint -->
    <p class="switch-hint" id="switch-hint">
      Don't have an account? <span id="switch-link">Register</span>
    </p>
  </div>

  <script src="log_n_reg.js"></script>
</body>
</html>
