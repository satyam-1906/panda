<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lazy Panda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 260px;
      font-family: "Inter", "Segoe UI", sans-serif;
      background: linear-gradient(-45deg, #E8E8E6, #DFDFDC, #F0F0EE, #E8E8E6);
      background-size: 400% 400%;
      animation: bg-shift 15s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
      position: relative;
    }

    /* Animated fluid mesh gradient blobs */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      filter: blur(55px);
      pointer-events: none;
      opacity: 0.8;
      mix-blend-mode: multiply;
      animation: fluid-mesh 12s ease-in-out infinite alternate;
    }
    body::before {
      width: 210px;
      height: 210px;
      top: -30px;
      left: -30px;
      background: radial-gradient(circle, rgba(88, 129, 87, 0.65) 0%, rgba(232, 232, 230, 0) 70%);
    }
    body::after {
      width: 190px;
      height: 190px;
      bottom: -30px;
      right: -30px;
      background: radial-gradient(circle, rgba(188, 184, 177, 0.65) 0%, rgba(232, 232, 230, 0) 70%);
      animation-delay: -5s;
    }
    @keyframes fluid-mesh {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }
      50% {
        transform: translate(25px, -15px) rotate(180deg) scale(1.2);
        border-radius: 60% 40% 50% 50% / 50% 60% 40% 60%;
      }
      100% {
        transform: translate(-15px, 20px) rotate(360deg) scale(0.95);
        border-radius: 50% 50% 60% 40% / 40% 40% 60% 50%;
      }
    }

    @keyframes bg-shift {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    /* Refractive Liquid Glass Card */
    .card {
      position: relative;
      width: 100%;
      border-radius: 18px;
      padding: 16px 14px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(28px) saturate(120%);
      -webkit-backdrop-filter: blur(28px) saturate(120%);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.95),
        inset 0 -1px 2px rgba(26, 26, 26, 0.06),
        0 1px 2px rgba(26, 26, 26, 0.03),
        0 12px 32px rgba(26, 26, 26, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 1;
    }

    /* Top inner highlight line */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      border-radius: 50%;
    }

    /* Brand row */
    .brand {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    /* Logo container */
    .logo-wrap {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        0 4px 12px rgba(88, 129, 87, 0.12);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 400ms cubic-bezier(0.25, 1, 0.5, 1), box-shadow 400ms cubic-bezier(0.25, 1, 0.5, 1);
    }
    .logo-wrap:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.95),
        0 6px 16px rgba(88, 129, 87, 0.2);
    }

    .logo-wrap img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    /* App name */
    .app-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #1A1A1A;
      letter-spacing: 0.01em;
    }

    /* Button group */
    .btn-group {
      display: flex;
      flex-direction: row;
      gap: 8px;
      width: 100%;
    }

    button {
      position: relative;
      width: 100%;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 9px 10px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: #1A1A1A;
      letter-spacing: 0.03em;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.9),
        inset 0 -1px 2px rgba(26, 26, 26, 0.04),
        0 4px 12px rgba(26, 26, 26, 0.06);
      transition: 
        transform 450ms cubic-bezier(0.25, 1, 0.5, 1), 
        box-shadow 450ms cubic-bezier(0.25, 1, 0.5, 1), 
        background-color 450ms cubic-bezier(0.25, 1, 0.5, 1), 
        border-color 450ms cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden;
    }

    /* Glass sheen */
    button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0) 100%);
      border-radius: inherit;
      pointer-events: none;
      transition: transform 600ms cubic-bezier(0.25, 1, 0.5, 1);
    }
    button:hover::before {
      transform: scale(1.08) translate(4px, 4px);
    }

    button:hover {
      transform: translateY(-2.5px);
    }

    button:active {
      transform: translateY(0) scale(0.97);
      transition: transform 100ms ease;
    }

    #read {
      background: rgba(88, 129, 87, 0.2);
      border-color: rgba(88, 129, 87, 0.5);
    }
    #read:hover {
      background: rgba(88, 129, 87, 0.32);
      border-color: rgba(88, 129, 87, 0.7);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.9),
        0 6px 18px rgba(88, 129, 87, 0.3);
    }

    #search {
      background: rgba(188, 184, 177, 0.2);
      border-color: rgba(188, 184, 177, 0.5);
    }
    #search:hover {
      background: rgba(188, 184, 177, 0.35);
      border-color: rgba(188, 184, 177, 0.7);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.95),
        0 6px 18px rgba(188, 184, 177, 0.25);
    }

    /* Loader inside buttons */
    .loader {
      display: inline-block;
      width: 11px;
      height: 11px;
      border: 1.5px solid rgba(26, 26, 26, 0.2);
      border-radius: 50%;
      border-top-color: #1A1A1A;
      animation: spin 0.8s linear infinite;
      margin-left: 6px;
      vertical-align: middle;
    }
    .tick {
      display: inline-block;
      margin-left: 6px;
      color: #2b7050;
      font-weight: bold;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Results list */
    .results-list {
      width: 100%;
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      scrollbar-width: thin;
      scrollbar-color: rgba(26, 26, 26, 0.15) transparent;
    }
    .results-list::-webkit-scrollbar {
      width: 4px;
    }
    .results-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .results-list::-webkit-scrollbar-thumb {
      background: rgba(26, 26, 26, 0.15);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .results-list::-webkit-scrollbar-thumb:hover {
      background: rgba(26, 26, 26, 0.25);
    }
    .results-list.hidden { display: none !important; }

    /* Each accordion item */
    .results-list li {
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.7);
      overflow: hidden;
      transition: all 400ms cubic-bezier(0.25, 1, 0.5, 1);
      flex-shrink: 0;
    }
    .results-list li.open {
      background: rgba(255, 255, 255, 0.5);
      border-color: rgba(88, 129, 87, 0.45);
    }

    /* Header row */
    .results-list li .item-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      cursor: pointer;
      user-select: none;
      transition: background-color 400ms cubic-bezier(0.25, 1, 0.5, 1);
    }
    .results-list li .item-header:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .results-list li .item-kw {
      flex: 1;
      font-size: 0.75rem;
      font-weight: 600;
      color: #1A1A1A;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .results-list li .item-ts {
      font-size: 0.68rem;
      color: #588157;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .results-list li .item-arrow {
      font-size: 0.55rem;
      color: rgba(26, 26, 26, 0.45);
      transition: transform 350ms cubic-bezier(0.25, 1, 0.5, 1);
      flex-shrink: 0;
      line-height: 1;
    }
    .results-list li.open .item-arrow {
      transform: rotate(180deg);
    }

    /* Link button */
    .results-list li .item-link {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.8);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 400ms cubic-bezier(0.25, 1, 0.5, 1);
      text-decoration: none;
      color: #588157;
      font-size: 0.65rem;
    }
    .results-list li .item-link:hover {
      background: rgba(88, 129, 87, 0.22);
      border-color: rgba(88, 129, 87, 0.5);
      color: #1A1A1A;
      transform: scale(1.05);
    }

    /* Expandable description */
    .results-list li .item-body {
      display: none;
      padding: 0 8px 7px;
      font-size: 0.70rem;
      color: rgba(26, 26, 26, 0.85);
      line-height: 1.5;
      border-top: 1px solid rgba(26, 26, 26, 0.06);
      padding-top: 6px;
    }
    .results-list li.open .item-body {
      display: block;
    }

    .results-list li.no-results {
      text-align: center;
      color: rgba(26, 26, 26, 0.55);
      font-size: 0.75rem;
      padding: 10px;
    }

    /* Tabs Container */
    .tabs-container {
      display: flex;
      width: 100%;
      background: rgba(26, 26, 26, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
      backdrop-filter: blur(10px);
    }
    
    .tab {
      flex: 1;
      text-align: center;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(26, 26, 26, 0.6);
      cursor: pointer;
      border-radius: 7px;
      transition: all 400ms cubic-bezier(0.25, 1, 0.5, 1);
      user-select: none;
    }
    
    .tab:hover {
      color: #212224;
    }
    
    .tab.active {
      color: #1A1A1A;
      background: rgba(255, 255, 255, 0.45);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.85),
        0 2px 8px rgba(26, 26, 26, 0.06);
    }

    /* Logout button */
    #logout-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 26px;
      height: 26px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(188, 184, 177, 0.18);
      border: 1px solid rgba(188, 184, 177, 0.5);
      color: #7d7973;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.65);
      transition: all 400ms cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 10;
    }
    #logout-btn::before, #logout-btn::after {
      display: none;
    }
    #logout-btn:hover {
      transform: translateY(-1px) scale(1.05);
      background: rgba(188, 184, 177, 0.35);
      border-color: rgba(188, 184, 177, 0.7);
      color: #1A1A1A;
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.65),
        0 4px 12px rgba(188, 184, 177, 0.25);
    }
    #logout-btn:active {
      transform: translateY(0) scale(0.95);
      transition: transform 100ms ease;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Logout Button -->
    <button id="logout-btn" title="Log Out" aria-label="Log Out">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
    </button>
    <div class="brand">
      <!-- Logo -->
      <div class="logo-wrap" aria-label="Lazy Panda logo">
        <img src="assets/panda.png" alt="Lazy Panda" />
      </div>

      <!-- Name: Lazy Panda -->
      <span class="app-name">Lazy Panda</span>
    </div>

    <!-- Buttons -->
    <div class="btn-group">
      <button id="read">
        <span class="btn-text">Read</span>
        <span class="loader hidden"></span>
        <span class="tick hidden">✓</span>
      </button>
      <button id="search">
        <span class="btn-text">Search</span>
        <span class="loader hidden"></span>
        <span class="tick hidden">✓</span>
      </button>
    </div>

    <!-- Tabs -->
    <div id="tabs" class="tabs-container hidden">
      <div class="tab active" id="tab-found">Found List</div>
      <div class="tab" id="tab-unfound">Unfound List</div>
    </div>

    <!-- Results -->
    <ul id="list" class="results-list hidden"></ul>
    <ul id="unfound-list" class="results-list hidden"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
