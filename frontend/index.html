<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lazy Panda — Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 260px;
      min-height: 220px;
      font-family: "Inter", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(130, 80, 255, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 90%, rgba(60, 200, 255, 0.28) 0%, transparent 50%),
        #0d1117;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
    }

    /* Animated glow blobs */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      animation: drift 8s ease-in-out infinite alternate;
    }
    body::before {
      width: 180px;
      height: 180px;
      top: -40px;
      left: -40px;
      background: rgba(120, 60, 255, 0.22);
    }
    body::after {
      width: 160px;
      height: 160px;
      bottom: -40px;
      right: -40px;
      background: rgba(40, 190, 255, 0.18);
      animation-delay: -4s;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(12px, 16px) scale(1.08); }
    }

    /* Main glass card */
    .card {
      position: relative;
      width: 100%;
      border-radius: 18px;
      padding: 20px 14px 16px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      box-shadow:
        0 2px 0 rgba(255,255,255,0.08) inset,
        0 24px 64px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Top highlight */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      border-radius: 50%;
    }

    /* Brand row */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .logo-wrap {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.18) inset,
        0 4px 16px rgba(100, 60, 255, 0.22);
      display: grid;
      place-items: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .logo-wrap img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .app-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f0f4ff;
      letter-spacing: 0.01em;
    }

    .tagline {
      font-size: 0.72rem;
      font-weight: 400;
      color: rgba(240, 244, 255, 0.45);
      letter-spacing: 0.02em;
      margin-top: -4px;
    }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }

    /* Button group */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
    }

    button {
      position: relative;
      width: 100%;
      border: none;
      cursor: pointer;
      border-radius: 10px;
      padding: 10px 10px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      color: #f0f4ff;
      letter-spacing: 0.03em;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.12) inset,
        0 4px 16px rgba(0, 0, 0, 0.25);
      transition: transform 200ms ease, box-shadow 200ms ease, background 200ms ease, border-color 200ms ease;
      overflow: hidden;
    }

    /* Glass sheen */
    button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, transparent 55%);
      border-radius: inherit;
      pointer-events: none;
    }

    /* Hover accent glow */
    button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(160,120,255,0.28) 0%, transparent 70%);
      opacity: 0;
      border-radius: inherit;
      transition: opacity 220ms ease;
      pointer-events: none;
    }

    button:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.11);
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.18) inset,
        0 10px 30px rgba(80, 40, 200, 0.28);
    }
    button:hover::after { opacity: 1; }

    button:active {
      transform: translateY(0) scale(0.97);
    }

    #btn-login {
      background: rgba(110, 80, 255, 0.18);
      border-color: rgba(140, 100, 255, 0.28);
    }
    #btn-login:hover {
      background: rgba(110, 80, 255, 0.3);
      border-color: rgba(160, 120, 255, 0.45);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.18) inset,
        0 10px 30px rgba(110, 80, 255, 0.3);
    }
    #btn-login::after {
      background: radial-gradient(circle at 50% 0%, rgba(140,100,255,0.32) 0%, transparent 70%);
    }

    #btn-register {
      background: rgba(40, 180, 255, 0.14);
      border-color: rgba(60, 200, 255, 0.24);
    }
    #btn-register:hover {
      background: rgba(40, 180, 255, 0.26);
      border-color: rgba(80, 210, 255, 0.4);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.18) inset,
        0 10px 30px rgba(40, 180, 255, 0.28);
    }
    #btn-register::after {
      background: radial-gradient(circle at 50% 0%, rgba(40,200,255,0.28) 0%, transparent 70%);
    }

    /* Spinner for auto-login check */
    .checking-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 0;
    }

    .checking-state .spinner {
      width: 26px;
      height: 26px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      border-top-color: rgba(140, 100, 255, 0.9);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .checking-state p {
      font-size: 0.72rem;
      color: rgba(240, 244, 255, 0.45);
      letter-spacing: 0.02em;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Brand -->
    <div class="brand">
      <div class="logo-wrap" aria-label="Lazy Panda logo">
        <img src="assets/panda.png" alt="Lazy Panda" />
      </div>
      <span class="app-name">Lazy Panda</span>
      <span class="tagline">your AI video companion</span>
    </div>

    <div class="divider"></div>

    <!-- Auto-login checking state -->
    <div id="checking" class="checking-state">
      <div class="spinner"></div>
      <p>Checking session…</p>
    </div>

    <!-- Auth buttons (shown only if auto-login fails) -->
    <div id="auth-buttons" class="btn-group hidden">
      <button id="btn-login">Login</button>
      <button id="btn-register">Create Account</button>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
