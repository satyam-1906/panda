<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lazy Panda — Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 260px;
      min-height: 220px;
      font-family: "Inter", "Segoe UI", sans-serif;
      background-color: #FAF8F5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
      position: relative;
    }

    /* Animated fluid mesh gradient blobs */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      filter: blur(50px);
      pointer-events: none;
      opacity: 0.8;
      mix-blend-mode: multiply;
      animation: fluid-mesh 14s ease-in-out infinite alternate;
    }
    body::before {
      width: 220px;
      height: 220px;
      top: -30px;
      left: -30px;
      background: radial-gradient(circle, rgba(121, 152, 114, 0.65) 0%, rgba(250, 248, 245, 0) 70%);
    }
    body::after {
      width: 200px;
      height: 200px;
      bottom: -30px;
      right: -30px;
      background: radial-gradient(circle, rgba(226, 149, 76, 0.55) 0%, rgba(250, 248, 245, 0) 70%);
      animation-delay: -7s;
    }
    @keyframes fluid-mesh {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }
      50% {
        transform: translate(25px, -15px) rotate(180deg) scale(1.2);
        border-radius: 60% 40% 50% 50% / 50% 60% 40% 60%;
      }
      100% {
        transform: translate(-15px, 20px) rotate(360deg) scale(0.95);
        border-radius: 50% 50% 60% 40% / 40% 40% 60% 50%;
      }
    }

    /* Main glass card */
    .card {
      position: relative;
      width: 100%;
      border-radius: 18px;
      padding: 20px 14px 16px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(30px) saturate(120%);
      -webkit-backdrop-filter: blur(30px) saturate(120%);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.95),
        inset 0 -1px 2px rgba(44, 45, 48, 0.06),
        0 1px 2px rgba(44, 45, 48, 0.03),
        0 16px 36px rgba(44, 45, 48, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 1;
    }

    /* Top highlight */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      border-radius: 50%;
    }

    /* Brand row */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .logo-wrap {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.9),
        0 4px 12px rgba(121, 152, 114, 0.12);
      display: grid;
      place-items: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: transform 400ms cubic-bezier(0.25, 1, 0.5, 1), box-shadow 400ms cubic-bezier(0.25, 1, 0.5, 1);
    }
    .logo-wrap:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow:
        inset 0 1px 1px rgba(255, 255, 255, 0.95),
        0 8px 18px rgba(121, 152, 114, 0.2);
    }
    .logo-wrap img {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .app-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #212224;
      letter-spacing: 0.01em;
    }

    .tagline {
      font-size: 0.72rem;
      font-weight: 400;
      color: rgba(33, 34, 36, 0.65);
      letter-spacing: 0.02em;
      margin-top: -4px;
    }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(33, 34, 36, 0.1), transparent);
    }

    /* Button group */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      width: 100%;
    }

    button {
      position: relative;
      width: 100%;
      border: none;
      cursor: pointer;
      border-radius: 12px;
      padding: 10px 10px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      color: #212224;
      letter-spacing: 0.03em;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.9),
        inset 0 -1px 2px rgba(33, 34, 36, 0.04),
        0 4px 12px rgba(33, 34, 36, 0.06);
      transition: 
        transform 450ms cubic-bezier(0.25, 1, 0.5, 1), 
        box-shadow 450ms cubic-bezier(0.25, 1, 0.5, 1), 
        background-color 450ms cubic-bezier(0.25, 1, 0.5, 1), 
        border-color 450ms cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden;
    }

    /* Glass sheen */
    button::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0) 100%);
      border-radius: inherit;
      pointer-events: none;
      transition: transform 600ms cubic-bezier(0.25, 1, 0.5, 1);
    }

    button:hover::before {
      transform: scale(1.08) translate(5px, 5px);
    }

    button:hover {
      transform: translateY(-2.5px);
    }

    button:active {
      transform: translateY(0) scale(0.97);
      transition: transform 100ms ease;
    }

    #btn-login {
      background: rgba(121, 152, 114, 0.22);
      border-color: rgba(121, 152, 114, 0.5);
    }
    #btn-login:hover {
      background: rgba(121, 152, 114, 0.35);
      border-color: rgba(121, 152, 114, 0.7);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.9),
        0 6px 20px rgba(121, 152, 114, 0.3);
    }

    #btn-register {
      background: rgba(226, 149, 76, 0.18);
      border-color: rgba(226, 149, 76, 0.45);
    }
    #btn-register:hover {
      background: rgba(226, 149, 76, 0.3);
      border-color: rgba(226, 149, 76, 0.65);
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.9),
        0 6px 20px rgba(226, 149, 76, 0.25);
    }

    /* Spinner for auto-login check */
    .checking-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 0;
    }

    .checking-state .spinner {
      width: 26px;
      height: 26px;
      border: 2px solid rgba(33, 34, 36, 0.12);
      border-radius: 50%;
      border-top-color: #799872;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .checking-state p {
      font-size: 0.72rem;
      color: rgba(33, 34, 36, 0.65);
      letter-spacing: 0.02em;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Brand -->
    <div class="brand">
      <div class="logo-wrap" aria-label="Lazy Panda logo">
        <img src="assets/panda.png" alt="Lazy Panda" />
      </div>
      <span class="app-name">Lazy Panda</span>
      <span class="tagline">your AI video companion</span>
    </div>

    <div class="divider"></div>

    <!-- Auto-login checking state -->
    <div id="checking" class="checking-state">
      <div class="spinner"></div>
      <p>Checking session…</p>
    </div>

    <!-- Auth buttons (shown only if auto-login fails) -->
    <div id="auth-buttons" class="btn-group hidden">
      <button id="btn-login">Login</button>
      <button id="btn-register">Create Account</button>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
